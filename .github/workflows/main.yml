name: Python CI
# Triggers the workslow on any push to main branch or pull request
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # step 1: check out the code from repository
      - name: Check out code
        uses: actions/checkout@v4
      # step2 :set up python enviornment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # step3 install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f    requirements.txt ]; then pip install -r requirements.txt; fi pip install pytest

      # set4 :Run test
      - name: Run tests
        run:  pytest



